name: Gerar executável do Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x86"
      - run: python -m pip install pyinstaller==5.13.2 requests==2.32.3
      - run: pyinstaller --onefile --clean --name BaixarCurriculos baixar_curriculos.py
      - uses: actions/upload-artifact@v4
        with:
          name: BaixarCurriculos-Windows
          path: dist/BaixarCurriculos.exe
